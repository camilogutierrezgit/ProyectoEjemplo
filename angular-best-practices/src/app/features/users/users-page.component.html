<div class="page-container glass-panel">
  <div class="page-header">
    <h1>User Management</h1>
  </div>

  <div class="layout-grid">
    <!-- Sidebar: Form -->
    <div class="sidebar">
      <app-user-form (save)="onSaveUser($event)"></app-user-form>
    </div>

    <!-- Main Content: Users List -->
    <div class="main-content-area">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading users...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="errorMessage" class="error-state">
        <p class="error-icon">⚠️</p>
        <p>{{ errorMessage }}</p>
        <button class="btn btn-primary" (click)="loadUsers()">Try Again</button>
      </div>

      <!-- Success State -->
      <div *ngIf="!isLoading && !errorMessage" class="users-grid">
        <app-user-card *ngFor="let user of users$ | async" [user]="user" (delete)="onDeleteUser($event)">
        </app-user-card>
      </div>
    </div>
  </div>
</div>
